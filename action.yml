name: iOS Simulator
description: Create and automatically clean up a configurable iOS Simulator for GitHub Actions
author: Plux Labs
branding:
  icon: smartphone
  color: gray-dark
inputs:
  device-type:
    description: Device type name or identifier, for example iPhone 16 Pro
    required: true
  runtime:
    description: iOS runtime version, identifier, or latest
    required: true
  name-prefix:
    description: Prefix used for the simulator name
    required: true
  reuse-existing:
    description: Reuse an available matching simulator with the requested prefix instead of creating one
    required: false
    default: 'false'
outputs:
  device-id:
    description: The simulator UDID
  device-name:
    description: The simulator name
  created:
    description: Whether this action created the simulator
runs:
  using: node24
  main: dist/main/index.js
  post: dist/post/index.js
  post-if: always()
